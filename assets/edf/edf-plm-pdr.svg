<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="36" fill="#f8fafc"/><rect x="60" y="60" width="1080" height="600" rx="30" fill="#fff" stroke="#dbeafe" stroke-width="3"/><text x="95" y="120" font-family="Arial" font-size="28" font-weight="700" fill="#1d4ed8">BASE TECHNIQUE DE MAINTENANCE</text><text x="95" y="165" font-family="Arial" font-size="44" font-weight="800" fill="#0f172a">Documentation → PLM → PDR</text><text x="95" y="205" font-family="Arial" font-size="21" fill="#64748b">Structuration des opérations, périodicités et pièces de rechange</text><g transform="translate(95 275)"><rect width="285" height="250" rx="24" fill="#eff6ff"/><text x="28" y="50" font-family="Arial" font-size="22" font-weight="700" fill="#1d4ed8">1. Documentation</text><text x="28" y="90" font-family="Arial" font-size="18" fill="#334155">• Manuels constructeurs</text><text x="28" y="125" font-family="Arial" font-size="18" fill="#334155">• Périodicités</text><text x="28" y="160" font-family="Arial" font-size="18" fill="#334155">• Kits / références</text><text x="28" y="195" font-family="Arial" font-size="18" fill="#334155">• Données à confirmer</text></g><g transform="translate(455 275)"><rect width="285" height="250" rx="24" fill="#ecfdf5"/><text x="28" y="50" font-family="Arial" font-size="22" font-weight="700" fill="#059669">2. PLM</text><text x="28" y="90" font-family="Arial" font-size="18" fill="#334155">• Contrôles</text><text x="28" y="125" font-family="Arial" font-size="18" fill="#334155">• Nettoyage</text><text x="28" y="160" font-family="Arial" font-size="18" fill="#334155">• Remplacement</text><text x="28" y="195" font-family="Arial" font-size="18" fill="#334155">• Classement par palier</text></g><g transform="translate(815 275)"><rect width="285" height="250" rx="24" fill="#fff7ed"/><text x="28" y="50" font-family="Arial" font-size="22" font-weight="700" fill="#ea580c">3. PDR</text><text x="28" y="90" f